services:
  postgres:
    image: postgres:17-alpine
    container_name: pulseboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulseboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pulseboard_local
    ports:
      - "5432:5432"
    volumes:
      - pulseboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulseboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pulseboard_pgdata:
